name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-typecheck-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up virtualenv (Python 3.10)
        run: uv venv --python 3.10

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check

      - name: Typecheck
        run: |
          uv run mypy src
          uv run python -c "import factorial"

      - name: Test
        run: uv run pytest tests/ -v --ignore=tests/integration/test_fixture_runtime.py

      - name: Build package
        run: uv run python -m build

  e2e-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up virtualenv (Python 3.10)
        run: uv venv --python 3.10

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run e2e fixtures
        run: uv run pytest tests/integration/test_fixture_runtime.py -v